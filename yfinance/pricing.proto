syntax = "proto3";

message PricingData {
    // 唯一的ID，通常是股票代码
    string id = 1;
    // 价格
    float price = 2;
    // 时间戳
    sint64 time = 3;
    // 货币
    string currency = 4;
    // 交易所
    string exchange = 5;
    // 报价类型
    int32 quote_type = 6;
    // 市场时间
    int32 market_hours = 7;
    // 变化百分比
    float change_percent = 8;
    // 当日交易量
    sint64 day_volume = 9;
    // 当日最高价
    float day_high = 10;
    // 当日最低价
    float day_low = 11;
    // 变化
    float change = 12;
    // 简称
    string short_name = 13;
    // 到期日期
    sint64 expire_date = 14;
    // 开盘价
    float open_price = 15;
    // 前一收盘价
    float previous_close = 16;
    // 行权价
    float strike_price = 17;
    // 标的符号
    string underlying_symbol = 18;
    // 未平仓合约
    sint64 open_interest = 19;
    // 期权类型
    sint64 options_type = 20;
    // 迷你期权
    sint64 mini_option = 21;
    // 最后成交量
    sint64 last_size = 22;
    // 买入价
    float bid = 23;
    // 买入量
    sint64 bid_size = 24;
    // 卖出价
    float ask = 25;
    // 卖出量
    sint64 ask_size = 26;
    // 价格提示
    sint64 price_hint = 27;
    // 24小时交易量
    sint64 vol_24hr = 28;
    // 所有货币的交易量
    sint64 vol_all_currencies = 29;
    // 源货币
    string from_currency = 30;
    // 最后市场
    string last_market = 31;
    // 流通供应量
    double circulating_supply = 32;
    // 市值
    double market_cap = 33;
}
